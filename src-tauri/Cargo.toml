[package]
name = "cursor_usage_overlay"
version = "0.1.0"
description = "A beautiful Windows overlay for Cursor usage"
authors = ["OpenAI"]
license = "MIT"
edition = "2021"

[lib]
name = "cursor_usage_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
