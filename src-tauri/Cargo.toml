[package]
name = "cursor_usage_overlay"
version = "0.1.0"
description = "Beautiful, native-feeling Windows desktop overlay for live Cursor plan usage with predictive forecasts and tear-off widgets."
authors = ["Alexander Bayerl <https://github.com/alexbayerl>"]
license = "MIT"
repository = "https://github.com/alexbayerl/lumos"
homepage = "https://github.com/alexbayerl/lumos"
readme = "../README.md"
keywords = ["cursor", "tauri", "overlay", "widget", "windows"]
categories = ["gui", "visualization"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cursor_usage_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
log = "0.4"
window-vibrancy = "0.6"
windows = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"
